<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Yolo Workstation{% endblock %}</title>
  <script>
    (() => {
      const stored = localStorage.getItem("yolows-theme");
      const prefersDark = window.matchMedia?.("(prefers-color-scheme: dark)")?.matches;
      const theme = stored === "dark" || (stored === "system" && prefersDark) ? "dark" : "light";
      document.documentElement.dataset.theme = theme;
      document.documentElement.dataset.themeMode = stored === "dark" || stored === "system" ? stored : "light";
    })();
  </script>
  <link rel="stylesheet" href="/static/css/app.css?v=20260526-theme">
  {% block styles %}{% endblock %}
</head>
<body>
  {% include "partials/header.html" %}
  {% block content %}{% endblock %}
  <button class="scroll-top-button" type="button" data-scroll-top aria-label="返回顶部" hidden>🔝</button>
  <script>
    (() => {
      const button = document.querySelector("[data-scroll-top]");
      if (!button) return;
      const update = () => {
        button.hidden = window.scrollY < 120;
      };
      button.addEventListener("click", () => {
        window.scrollTo({top: 0, behavior: "smooth"});
      });
      window.addEventListener("scroll", update, {passive: true});
      update();
    })();
  </script>
</body>
</html>
