  <script>
    window.yoloutilsUsername = "";
    window.yoloutilsUsernameReady = new Promise(resolve => {
      window.yoloutilsResolveUsername = resolve;
    });
    window.yoloutilsGetClientId = () => {
      const key = "yoloutils-workstation-client-id";
      let id = "";
      try {
        id = localStorage.getItem(key) || "";
      } catch (error) {
        id = window.yoloutilsClientId || "";
      }
      if (!id) {
        id = crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random()}`;
        try {
          localStorage.setItem(key, id);
        } catch (error) {
          window.yoloutilsClientId = id;
        }
      }
      return id || window.yoloutilsClientId;
    };
    window.yoloutilsSubmitUsername = async event => {
      if (event) event.preventDefault();
      const input = document.getElementById("usernameInput");
      const submit = document.getElementById("usernameSubmit");
      const name = (input?.value || "").trim();
      if (!name) {
        input?.focus();
        return;
      }
      if (document.body.dataset.teamMode === "true") {
        try {
          if (submit) submit.disabled = true;
          const response = await fetch("/api/presence", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({client_id: window.yoloutilsGetClientId(), username: name})
          });
          if (!response.ok) {
            let message = await response.text();
            try {
              message = JSON.parse(message).detail || message;
            } catch (error) {
              // Keep plain response text.
            }
            alert(message || "用户名不可用");
            input?.focus();
            return;
          }
        } catch (error) {
          alert(`登录失败: ${error.message}`);
          input?.focus();
          return;
        } finally {
          if (submit) submit.disabled = false;
        }
      }
      window.yoloutilsUsername = name;
      try {
        localStorage.setItem("yoloutils-workstation-username", name);
      } catch (error) {
        // localStorage can be blocked in some app-window modes.
      }
      document.body.classList.remove("username-required");
      window.yoloutilsResolveUsername?.();
    };
    document.addEventListener("DOMContentLoaded", () => {
      const form = document.getElementById("usernameForm");
      const input = document.getElementById("usernameInput");
      try {
        input.value = localStorage.getItem("yoloutils-workstation-username") || "";
      } catch (error) {
        input.value = "";
      }
      form?.addEventListener("submit", window.yoloutilsSubmitUsername);
      if (document.body.classList.contains("username-required")) input?.focus();
    });
  </script>

    async function getJson(url) {
      const response = await fetch(url);
      if (!response.ok) throw new Error(await response.text());
      return response.json();
    }

    async function postJson(url, payload) {
      const response = await fetch(url, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(payload),
      });
      if (!response.ok) throw new Error(await response.text());
      return response.json();
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;",
      }[char]));
    }

    function hashColor(value) {
      let hash = 0;
      for (let index = 0; index < value.length; index += 1) {
        hash = ((hash << 5) - hash + value.charCodeAt(index)) | 0;
      }
      return colors[Math.abs(hash) % colors.length];
    }

    async function loadTreeChildren(node, childrenEl) {
      if (node.children_loaded) return;
      childrenEl.innerHTML = '<div class="empty">加载中...</div>';
      const data = await getJson(`/api/tree?directory=${encodeURIComponent(node.path)}`);
      node.children = data.children || [];
      node.children_loaded = true;
      childrenEl.innerHTML = "";
      for (const child of node.children) renderTree(child, childrenEl);
    }

    function clearTreeDropTargets() {
      document.querySelectorAll("#tree .tree-select.drop-target")
        .forEach(item => item.classList.remove("drop-target"));
    }

    async function moveDraggedFileToDirectory(targetDir) {
      const path = draggedFilePath;
      draggedFilePath = "";
      clearTreeDropTargets();
      if (!path || targetDir === currentDir) return;
      const nextPath = path === currentPath ? nextFileAfterDelete(path) : null;
      try {
        await postJson("/api/classify/file/move", {path, directory: targetDir});
      } catch (error) {
        alert(error.message);
        return;
      }
      if (path === currentPath) {
        currentPath = "";
        currentImage = null;
        currentLabelFile = "";
        currentBoxes = [];
        savedBoxes = [];
        selectedBoxIndex = -1;
        setBoxesDirty(false);
      }
      await loadTree();
      await loadLabels();
      await refreshCurrentFiles();
      if (nextPath && currentFiles.some(file => file.path === nextPath)) {
        await selectImage(nextPath, fileRow(nextPath));
      } else if (!currentPath) {
        await selectFirstCurrentFile();
      }
    }

    function renderTree(node, parent = treeEl) {
      const wrapper = document.createElement("div");
      wrapper.className = "tree-node";
      const row = document.createElement("div");
      row.className = "tree-row";
      const hasChildren = (node.children || []).length > 0 || node.has_child_dirs;
      const isRoot = parent === treeEl;
      if (isRoot) wrapper.classList.add("root-node");
      const isCollapsed = collapsedDirs.has(node.path);
      if (hasChildren && !isRoot) {
        const toggle = document.createElement("button");
        toggle.type = "button";
        toggle.className = "tree-toggle";
        toggle.textContent = isCollapsed ? "▸" : "⌄";
        toggle.title = isCollapsed ? "展开目录" : "折叠目录";
        toggle.onclick = async event => {
          event.stopPropagation();
          const children = wrapper.querySelector(":scope > .tree-children");
          if (collapsedDirs.has(node.path)) {
            collapsedDirs.delete(node.path);
            toggle.textContent = "⌄";
            toggle.title = "折叠目录";
            if (children) {
              children.hidden = false;
              await loadTreeChildren(node, children);
            }
          } else {
            collapsedDirs.add(node.path);
            toggle.textContent = "▸";
            toggle.title = "展开目录";
            if (children) children.hidden = true;
          }
        };
        row.appendChild(toggle);
      } else {
        const placeholder = document.createElement("span");
        placeholder.className = "tree-toggle-placeholder";
        row.appendChild(placeholder);
      }
      const button = document.createElement("button");
      button.className = "tree-select";
      button.dataset.path = node.path;
      button.title = node.path || node.name || "/";
      const icon = document.createElement("span");
      icon.className = "tree-icon";

      return [...currentFiles].sort((left, right) => {

        if (rankDiff !== 0) return rankDiff;
        return left.name.localeCompare(right.name, "zh-Hans-CN", {numeric: true, sensitivity: "base"});
      });

        ".bmp": "▥",
        ".webp": "◫",
        ".tif": "◬",
        ".tiff": "◭",

    function resetImageZoom() {

    function updateZoomIndicator() {
      const percent = Math.round(imageZoom * 100);
      zoomIndicator.innerHTML = `${percent}%<span class="zoom-reset-hint">↺ ESC</span>`;
      zoomIndicator.hidden = percent === 100;
    }

    function applyImageZoom() {
      if (!currentImage) {
        canvas.style.width = "";
        canvas.style.height = "";
        updateZoomIndicator();
        return;
      }
      const wrapper = canvas.parentElement;
      const availableWidth = Math.max(1, wrapper.clientWidth - 32);
      const availableHeight = Math.max(1, wrapper.clientHeight - 32);
      const fitScale = Math.min(
        1,
        availableWidth / currentImage.naturalWidth,
        availableHeight / currentImage.naturalHeight,
      );
      canvas.style.width = `${Math.max(1, Math.round(currentImage.naturalWidth * fitScale * imageZoom))}px`;
      canvas.style.height = `${Math.max(1, Math.round(currentImage.naturalHeight * fitScale * imageZoom))}px`;
      updateZoomIndicator();
    }

    function setImageZoom(nextZoom, clientX, clientY) {
      if (!currentImage) return;
      const wrapper = canvas.parentElement;
      const before = canvas.getBoundingClientRect();
      const ratioX = before.width ? (clientX - before.left) / before.width : 0.5;
      const ratioY = before.height ? (clientY - before.top) / before.height : 0.5;
      imageZoom = Math.min(Math.max(nextZoom, 0.1), 8);
      applyImageZoom();
      const after = canvas.getBoundingClientRect();
      wrapper.scrollLeft += ratioX * (after.width - before.width);
      wrapper.scrollTop += ratioY * (after.height - before.height);
    }

    function imageToneData(image) {
      const sampleWidth = Math.min(256, image.naturalWidth);
      const sampleHeight = Math.max(1, Math.round(image.naturalHeight * sampleWidth / image.naturalWidth));
      const sampleCanvas = document.createElement("canvas");
      sampleCanvas.width = sampleWidth;
      sampleCanvas.height = sampleHeight;
      const sampleCtx = sampleCanvas.getContext("2d", { willReadFrequently: true });
      sampleCtx.drawImage(image, 0, 0, sampleWidth, sampleHeight);
      const pixels = sampleCtx.getImageData(0, 0, sampleWidth, sampleHeight).data;
      const red = new Array(256).fill(0);
      const green = new Array(256).fill(0);
      const blue = new Array(256).fill(0);
      const luminance = new Array(256).fill(0);
      for (let index = 0; index < pixels.length; index += 4) {
        const r = pixels[index];
        const g = pixels[index + 1];
        const b = pixels[index + 2];
        red[r] += 1;
        green[g] += 1;
        blue[b] += 1;
        luminance[Math.round(r * 0.299 + g * 0.587 + b * 0.114)] += 1;
      }
      return {red, green, blue, luminance, total: sampleWidth * sampleHeight};
    }

    function prepareHistogramCanvas() {
      const width = histogramCanvas.clientWidth || 180;
      const height = histogramCanvas.clientHeight || 92;
      const dpr = window.devicePixelRatio || 1;
      histogramCanvas.width = Math.round(width * dpr);
      histogramCanvas.height = Math.round(height * dpr);
      histogramCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
      histogramCtx.clearRect(0, 0, width, height);
      histogramCtx.fillStyle = "#fff";
      histogramCtx.fillRect(0, 0, width, height);
      return {width, height};
    }

    function drawHistogram(image) {
      const {red, green, blue} = imageToneData(image);
      const {width, height} = prepareHistogramCanvas();
      drawHistogramChannel(red, "#e11d48", width, height);
      drawHistogramChannel(green, "#16a34a", width, height);
      drawHistogramChannel(blue, "#2563eb", width, height);
    }

    function drawHistogramChannel(values, color, width, height) {
      const maxValue = Math.max(...values);
      if (!maxValue) return;
      histogramCtx.beginPath();
      values.forEach((value, index) => {
        const x = index / 255 * width;
        const y = height - value / maxValue * (height - 8) - 4;
        if (index === 0) histogramCtx.moveTo(x, y);
        else histogramCtx.lineTo(x, y);
      });
      histogramCtx.strokeStyle = color;
      histogramCtx.globalAlpha = 0.82;
      histogramCtx.lineWidth = 1.4;
      histogramCtx.stroke();
      histogramCtx.globalAlpha = 1;
    }

    function drawLevels(image) {
      const {luminance} = imageToneData(image);
      const {width, height} = prepareHistogramCanvas();
      const chartHeight = Math.max(24, height - 18);
      const maxValue = Math.max(...luminance);
      histogramCtx.fillStyle = "#3f3f3f";
      histogramCtx.fillRect(0, 0, width, chartHeight);
      if (maxValue) {
        histogramCtx.beginPath();
        histogramCtx.moveTo(0, chartHeight);
        luminance.forEach((value, index) => {
          const x = index / 255 * width;
          const y = chartHeight - value / maxValue * (chartHeight - 8) - 4;
          histogramCtx.lineTo(x, y);
        });
        histogramCtx.lineTo(width, chartHeight);
        histogramCtx.closePath();
        histogramCtx.fillStyle = "#ffffff";
        histogramCtx.fill();
        histogramCtx.strokeStyle = "#ffffff";
        histogramCtx.globalAlpha = 1;
        histogramCtx.lineWidth = 1;
        histogramCtx.stroke();
      }
      histogramCtx.fillStyle = "#ffffff";
      histogramCtx.fillRect(0, chartHeight, width, height - chartHeight);
      const gradient = histogramCtx.createLinearGradient(0, 0, width, 0);
      gradient.addColorStop(0, "#020617");
      gradient.addColorStop(0.5, "#94a3b8");
      gradient.addColorStop(1, "#ffffff");
      histogramCtx.fillStyle = gradient;
      histogramCtx.fillRect(0, chartHeight + 5, width, 10);
      histogramCtx.strokeStyle = "#cbd5e1";
      histogramCtx.lineWidth = 1;
      histogramCtx.strokeRect(0.5, chartHeight + 5.5, width - 1, 9);
    }

        key === "0" || key === "`" || key === "~" || key === "～" || key === "·" ||

    function renderProjectUsers(users) {
      const byName = new Map();
      for (const item of users || []) {
        const user = typeof item === "string" ? {name: item} : item || {};
        const name = String(user.name || user.username || "").trim();
        if (!name || byName.has(name)) continue;
        byName.set(name, {
          name,
          color: user.color || userColor(name),
          initial: user.initial || name.slice(0, 1),
        });
      }
      const names = Array.from(byName.values());
      onlineCount.textContent = names.length;
      collaborationUsers.innerHTML = names.length
        ? names.map(user => {
            const safeName = escapeHtml(user.name);
            return `<div class="collaboration-user" title="${safeName}"><span class="collaboration-dot" style="--user-color:${escapeHtml(user.color)}"></span><span class="collaboration-name">${safeName}</span></div>`;
          }).join("")
        : '<div class="collaboration-empty">暂无在线用户</div>';
    }

    function clientId() {
      return window.yoloutilsGetClientId ? window.yoloutilsGetClientId() : window.yoloutilsClientId;

    function userColor(value) {
      const colors = ["#ef4444", "#f97316", "#eab308", "#22c55e", "#14b8a6", "#3b82f6", "#8b5cf6", "#ec4899"];
      let total = 0;
      for (const char of value || "") {
        total += char.charCodeAt(0);
      }
      return colors[total % colors.length];
    }

    async function updatePresence() {
      if (!teamMode) return;
      await usernameReady;
      try {
        const data = await postJson("/api/presence", {client_id: clientId(), username: username || "独立用户"});
        const projectUsers = Array.isArray(window.yoloutilsOnlineUsers) ? window.yoloutilsOnlineUsers : [];
        const presenceUsers = (data.users || []).map(user => user.username);
        renderProjectUsers([...projectUsers, ...presenceUsers]);

        const projectUsers = Array.isArray(window.yoloutilsOnlineUsers) ? window.yoloutilsOnlineUsers : [];
        renderProjectUsers(projectUsers);

        const data = await response.json().catch(() => ({}));
        if (!response.ok || !data.ok) return;
        window.yoloutilsOnlineUsers = data.users || [];

    function leavePresence() {
      if (!teamMode) return;
      const payload = JSON.stringify({client_id: clientId()});
      if (navigator.sendBeacon) {
        navigator.sendBeacon("/api/presence/leave", new Blob([payload], {type: "application/json"}));
        return;
      }
      fetch("/api/presence/leave", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: payload,
        keepalive: true,

    function renderBreadcrumb() {
      const container = document.createElement("div");
      container.className = "breadcrumb";
      const home = document.createElement("span");
      home.className = "breadcrumb-home";
      home.textContent = "⌂";
      home.title = "Home";
      container.appendChild(home);
      const currentPathParts = currentPath ? currentPath.split("/").filter(Boolean) : [];
      const fileName = currentPathParts.length ? currentPathParts[currentPathParts.length - 1] : "";
      const parts = currentPathParts.length
        ? currentPathParts.slice(0, -1)
        : currentDir ? currentDir.split("/").filter(Boolean) : [];
      const crumbs = [];
      let path = "";
      for (const part of parts) {
        path = path ? `${path}/${part}` : part;
        crumbs.push({name: part, path});
      }
      container.title = currentPath || currentDir || ".";
      crumbs.forEach((crumb, index) => {
        if (index > 0) {
          const separator = document.createElement("span");
          separator.className = "breadcrumb-separator";
          separator.textContent = ">";
          container.appendChild(separator);
        }
        const button = document.createElement("button");
        button.type = "button";
        button.textContent = crumb.name;
        button.title = crumb.path || ".";
        button.onclick = () => selectDir(crumb.path);
        container.appendChild(button);
      });
      if (fileName) {
        if (crumbs.length) {
          const separator = document.createElement("span");
          separator.className = "breadcrumb-separator";
          separator.textContent = ">";
          container.appendChild(separator);
        }
        const file = document.createElement("span");
        file.className = "breadcrumb-file";
        file.textContent = fileName;
        file.title = currentPath;
        container.appendChild(file);
      }
      return container;

    function showContextActionDialog(options) {
      return new Promise(resolve => {
        if (contextActionResolve) {
          contextActionResolve(null);
        }
        contextActionResolve = resolve;
        contextActionTitle.textContent = options.title || "确认操作";
        contextActionMessage.textContent = options.message || "";
        contextActionConfirm.textContent = options.confirmText || "确定";
        contextActionRiskWrap.hidden = !options.risk;
        contextActionRiskCheck.checked = false;
        contextActionConfirm.disabled = Boolean(options.risk);
        if (options.input) {
          contextActionInputWrap.hidden = false;
          contextActionInputLabel.textContent = options.inputLabel || "名称";
          contextActionInput.value = options.value || "";
        } else {
          contextActionInputWrap.hidden = true;
          contextActionInput.value = "";
        }
        if (contextActionDialog.open) {
          contextActionDialog.close();
        }
        contextActionDialog.showModal();
        if (options.input) {
          contextActionInput.focus();
          contextActionInput.select();
        } else if (!options.risk) {
          contextActionConfirm.focus();
        } else {
          contextActionRiskCheck.focus();
        }
      });
    }

    function closeContextActionDialog(value) {
      const resolve = contextActionResolve;
      contextActionResolve = null;
      if (contextActionDialog.open) {
        contextActionDialog.close();
      }
      contextActionConfirm.disabled = false;
      if (resolve) {
        resolve(value);
      }
    }

    function riskMessageForLabel(action, label) {
      if (action === "delete") {
        return [
          `即将删除标签 ${label.index}: ${label.label}。`,
          "此操作会修改 classes.txt，并批量打开所有标注 .txt：删除对应索引的标注行，再把后续索引整体前移。",
          "这是高风险操作，执行前建议备份项目目录。",
        ].join("\n");
      }
      if (action === "move_to") {
        return [
          `即将把仅包含标签 ${label.index}: ${label.label} 的图片和 .txt 移动到指定目录。`,
          "执行前会扫描所有命中的 .txt；如果某个 .txt 同时包含其他标签，将阻止操作并列出文件。",
          "这是高风险操作，执行前建议备份项目目录。",
        ].join("\n");
      }
      return [
        `即将把仅包含标签 ${label.index}: ${label.label} 的图片和 .txt 复制到指定目录。`,
        "执行前会扫描所有命中的 .txt；如果某个 .txt 同时包含其他标签，将阻止操作并列出文件。",
        "这是高风险操作，执行前建议备份项目目录。",
      ].join("\n");
    }

    async function runLabelAction(action) {
      const label = contextLabel;
      hideContextMenu();
      if (!label) return;
      if (action === "find") {
        const url = new URL("/" + "media/image", window.location.origin);
        const project = window.yoloutilsProject || "";
        if (project) {
          url.searchParams.set("project", project);
        }
        url.searchParams.set("label", String(label.index));
        url.searchParams.set("label_name", label.label || "");
        url.searchParams.set("return_to", window.location.pathname + window.location.search);
        window.open(url.toString(), "_blank", "noopener");
        return;
      }
      const payload = {action, index: Number(label.index)};
      if (action === "copy_to" || action === "move_to") {
        const answer = await showContextActionDialog({
          title: action === "copy_to" ? "复制标签文件" : "移动标签文件",
          message: riskMessageForLabel(action, label),
          input: true,
          inputLabel: "目标目录名",
          value: "",
          confirmText: action === "copy_to" ? "复制到" : "移动到",
          risk: true,
        });
        const directory = String(answer?.name ?? "").trim();
        if (!directory) return;
        payload.directory = directory;
      } else if (action === "delete") {
        const confirmed = await showContextActionDialog({
          title: "删除标签并重建索引",
          message: riskMessageForLabel(action, label),
          confirmText: "删除并重建",
          risk: true,
        });
        if (!confirmed) return;
      } else {
        return;
      }
      try {
        const result = await postJson("/api/classes/action", payload);
        if (result?.ok === false) {
          const blocked = Array.isArray(result.blocked) ? result.blocked : [];
          const list = blocked
            .map(item => `${item.image || item.txt}  标签: ${(item.labels || []).join(", ")}`)
            .join("\n");
          await showContextActionDialog({
            title: "不能复制或移动",
            message: `${result.message || "不满足条件，不能复制或移动。"}${list ? `\n\n${list}` : ""}`,
            confirmText: "知道了",
          });
          return;
        }
        classesText = result.content || classesText;
      } catch (error) {
        alert(error.message);
        return;
      }
      currentLabelFile = "";
      await loadLabels();
      await loadStatistics();
      if (action === "copy_to" || action === "move_to") {
        await loadTree();
        await selectDir(currentDir, findTreeButton(currentDir));
      } else {
        await refreshCurrentFiles();
      }
      if (currentPath && (action !== "copy_to" && action !== "move_to")) {
        await selectImage(currentPath, fileRow(currentPath));
      }
    }

    async function runDirectoryAction(action) {

        create_negative_txt: "创建负样本集空 .txt 文件",
        lowercase: "文件名和扩展转小写",

      };
      if (action === "delete_directory" && !path) {
        alert("不能删除根目录");
        return;
      }
      let name = "";
      if (action === "rename") {
        const currentName = (path || "").split("/").pop();
        const answer = await showContextActionDialog({
          title: "重命名目录",
          message: path || "根目录",
          input: true,
          inputLabel: "新的目录名",
          value: currentName || "",
          confirmText: "重命名",

          title: labels[action] || "执行操作",

          confirmText: "执行",

          currentDir = `${result.renamed.to}${currentDir.slice(path.length)}`;
        }

      const affectsCurrentDir = !path || path === currentDir || currentDir.startsWith(`${path}/`) || ["lowercase", "uppercase", "rename"].includes(action);

    async function runFileAction(action) {
      const path = contextFilePath || currentPath;
      hideContextMenu();
      if (!path || (path === currentPath && lockedByOther)) return;
      const labels = {
        delete_file: "删除文件",
        delete_txt: "删除 .txt 文件",
        create_negative_txt: "创建负样本集空 .txt 文件",
        lowercase: "文件名和扩展转小写",
        uppercase: "文件名和扩展转大写",
        rename: "重命名",
      };
      if (action === "share") {
        await shareFile(path);
        return;
      }
      let name = "";
      if (action === "rename") {
        const answer = await showContextActionDialog({
          title: "重命名文件",
          message: path,
          input: true,
          inputLabel: "新的文件名",
          value: path.split("/").pop() || "",
          confirmText: "重命名",
        });
        name = answer?.name?.trim() || "";
        if (!name) return;
      } else {
        const confirmed = await showContextActionDialog({
          title: labels[action] || "执行操作",
          message: path,
          confirmText: "执行",
        });
        if (!confirmed) return;
      }
      const nextPath = action === "delete_file" ? nextFileAfterDelete(path) : null;
      try {
        if (action === "delete_file") {
          await postJson("/api/file/delete", {
            path,
            client_id: clientId(),
            username: username || "独立用户",
          });
        } else {
          await postJson("/api/file/action", {path, action, name});

    async function queryLocation() {
      const answer = await showContextActionDialog({
        title: "查询",
        message: "查询目录或当前文件",
        input: true,
        inputLabel: "关键字",
        value: currentPath || currentDir || "",
        confirmText: "查询",
      });
      const keyword = answer?.name?.trim() || "";
      if (!keyword) return;
      const query = keyword.toLowerCase();
      const dirButton = Array.from(document.querySelectorAll("#tree button")).find(button => {
        const path = (button.dataset.path || "").toLowerCase();
        const name = button.querySelector(".tree-name")?.textContent.toLowerCase() || "";
        return path === query || path.includes(query) || name === query || name.includes(query);
      });
      if (dirButton) {
        await selectDir(dirButton.dataset.path || "", dirButton);
        return;
      }
      const file = currentFiles.find(item => {
        const name = item.name.toLowerCase();
        const path = item.path.toLowerCase();
        return name === query || path === query || name.includes(query) || path.includes(query);
      });
      if (file) {
        const row = Array.from(document.querySelectorAll("#files button"))
          .find(button => button.dataset.path === file.path);

    function initKeyboardShortcuts() {
      window.addEventListener("keydown", event => {
        const shortcutKey = String(event.key || "").toLowerCase();
        if (event.target instanceof Element && event.target.closest("input, textarea, select")) return;
        if (event.key === "Escape") {
          if (!shortcutPopover.hidden) {
            shortcutPopover.hidden = true;
          } else if (currentImage) {
            resetImageZoom();
          }
          return;
        }
        if (!event.metaKey && !event.ctrlKey && event.key === "ArrowUp") {
          event.preventDefault();
          selectAdjacentTree(-1);
          return;
        }
        if (!event.metaKey && !event.ctrlKey && event.key === "ArrowDown") {
          event.preventDefault();
          selectAdjacentTree(1);
          return;
        }
        if (!event.metaKey && !event.ctrlKey && event.key === "ArrowLeft") {
          event.preventDefault();
          selectAdjacentImage(-1);
          return;
        }
        if (!event.metaKey && !event.ctrlKey && event.key === "ArrowRight") {
          event.preventDefault();
          selectAdjacentImage(1);
          return;
        }
        if (!(event.metaKey || event.ctrlKey)) return;
        const key = shortcutKey;
        if (key === "h") {
          event.preventDefault();
          openHelp();
          return;
        }
        const labelShortcut = labelShortcutIndex(event);
        if (labelShortcut !== null) {
          event.preventDefault();
          selectClassByShortcut(labelShortcut);
        } else if (key === "d") {
          event.preventDefault();
          downloadCurrentImage();
        }
      }, true);
    }

    function canvasPoint(event) {
      const rect = canvas.getBoundingClientRect();
      return {
        x: Math.min(Math.max((event.clientX - rect.left) / rect.width, 0), 1),
        y: Math.min(Math.max((event.clientY - rect.top) / rect.height, 0), 1),
      };
    }

    function rectContains(rect, point) {
      return point.x >= rect.left && point.x <= rect.right && point.y >= rect.top && point.y <= rect.bottom;

        histogramPane.style.flexBasis = "";
        histogramPane.style.flexGrow = "";
        histogramPane.style.flexShrink = "";
        exifPane.style.flexBasis = "";
        exifPane.style.flexGrow = "";
        exifPane.style.flexShrink = "";
      }

      hideRight.addEventListener("click", () => {
        appMain.classList.add("right-hidden");
        const leftWidth = leftPanel.getBoundingClientRect().width;
        setMainColumns(leftWidth);
      });
      showRight.addEventListener("click", () => {
        appMain.classList.remove("right-hidden");
        const leftWidth = leftPanel.getBoundingClientRect().width;
        setMainColumns(leftWidth);
        scheduleRightPanelGoldenLayout();
      });
      window.addEventListener("resize", scheduleRightPanelGoldenLayout);
      switchHistogramMode.addEventListener("click", () => {
        histogramMode = histogramMode === "levels" ? "histogram" : "levels";
        updateHistogramModeHeader();
        redrawHistogram();
      });
      toggleHistogram.addEventListener("click", () => {
        const isCollapsed = rightPanel.classList.contains("histogram-collapsed");
        if (isCollapsed) {
          rightPanel.classList.remove("histogram-collapsed");
          if (histogramExpandedLabelsHeight) {
            labelsPane.style.flexBasis = `${histogramExpandedLabelsHeight}px`;
            labelsPane.style.flexGrow = "0";
            labelsPane.style.flexShrink = "0";
          }
          if (rightPanel.classList.contains("exif-collapsed")) {
            topInfoPane.style.flexBasis = "";
            topInfoPane.style.flexGrow = "1";
            topInfoPane.style.flexShrink = "1";
          } else if (histogramExpandedTopHeight) {
            topInfoPane.style.flexBasis = `${histogramExpandedTopHeight}px`;
            topInfoPane.style.flexGrow = "0";
          }
          toggleHistogram.textContent = "⌄";
        } else {
          if (rightPanel.classList.contains("exif-collapsed")) {
            histogramExpandedLabelsHeight = labelsPane.getBoundingClientRect().height;
            clearInlineFlex(labelsPane);
            topInfoPane.style.flexBasis = "";
            topInfoPane.style.flexGrow = "1";
            topInfoPane.style.flexShrink = "1";
          } else {
            const topHeight = topInfoPane.getBoundingClientRect().height;
            const labelsHeight = labelsPane.getBoundingClientRect().height;
            const histogramHeaderHeight = histogramPane.querySelector(".pane-header").getBoundingClientRect().height;
            histogramExpandedTopHeight = topHeight;
            histogramExpandedLabelsHeight = labelsHeight;
            labelsPane.style.flexBasis = `${labelsHeight}px`;
            labelsPane.style.flexGrow = "0";
            topInfoPane.style.flexBasis = `${labelsHeight + histogramHeaderHeight}px`;
            topInfoPane.style.flexGrow = "0";
          }
          rightPanel.classList.add("histogram-collapsed");
          giveCollapsedSpaceToLabels();
          toggleHistogram.textContent = "⌃";
        }
        redrawHistogram();
      });
      toggleExif.addEventListener("click", () => {
        const collapsed = rightPanel.classList.toggle("exif-collapsed");
        if (collapsed) {
          clearInlineFlex(labelsPane);
          clearInlineFlex(histogramPane);
          topInfoPane.style.flexBasis = "";
          topInfoPane.style.flexGrow = "1";
          topInfoPane.style.flexShrink = "1";
          exifPane.style.flexBasis = "34px";
          exifPane.style.flexGrow = "0";
          exifPane.style.flexShrink = "0";
          giveCollapsedSpaceToLabels();
        } else {
          exifPane.style.flexBasis = "";
          exifPane.style.flexGrow = "";
          exifPane.style.flexShrink = "";
          scheduleRightPanelGoldenLayout();
        }
        toggleExif.textContent = collapsed ? "⌃" : "⌄";
        redrawHistogram();
      });
      scheduleRightPanelGoldenLayout();
    }
    init().catch(error => {
      document.body.innerHTML = `<pre>${error.stack || error}</pre>`;
    });
  </script>
